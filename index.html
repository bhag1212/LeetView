<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetView</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">


</head>
<body>
    <div class="container">
        <h1>LeetView</h1>
        <div class="user-container">
            <p>Enter the username:</p>
            <div class="user-input-container">
                <input type="text" placeholder="Enter user name" id="user-input">
                <button id="search-bar">Search</button>
            </div>

        </div>

        <div class="stats-container">
            <div class="progress">
                <div class="progress-items">
                    <div class="easy-progress circle">
                        <span id="easy-label">Easy</span>

                    </div>
                </div>
                <div class="progress-items">
                    <div class="medium-progress circle">
                        <span id="medium-label">Medium</span>

                    </div>
                </div>
                <div class="progress-items">
                    <div class="hard-progress circle">
                        <span id="hard-label">Hard</span>

                    </div>
                </div>
            </div>
            <div class="stats-cards">

            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
